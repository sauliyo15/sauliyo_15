
name: Deploy Preview to Firebase Hosting on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Decode Google Credentials
        run: |
          echo "${GOOGLE_APPLICATION_CREDENTIALS}" | base64 -d > $HOME/gcloud-key.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Preview Channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/gcloud-key.json
        run: |
          firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} \
            --only hosting:sauliyo15 \
            --project sauliyo15-63895 \
            --expires 7d \
            --json > deploy_output.json

      - name: Extract Preview URL
        id: get_preview_url
        run: |
          url=$(cat deploy_output.json | jq -r '.result[].url')
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Comment Preview URL
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = "${{ steps.get_preview_url.outputs.preview_url }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview desplegado para esta PR**\n\n🔗 URL: ${url}\n\nEste preview se eliminará automáticamente después de 7 días.`
            });
